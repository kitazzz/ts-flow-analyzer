name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: build-${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.92.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path analyzer/Cargo.toml --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          archive_base="ts-flow-analyzer-${version}-${{ matrix.artifact_suffix }}"
          stage_dir="dist/${archive_base}"
          mkdir -p "${stage_dir}"

          cp "target/${{ matrix.target }}/release/ts-flow-analyzer" "${stage_dir}/"
          cp README.md "${stage_dir}/"
          cp docs/CLI.md "${stage_dir}/CLI.md"
          cp analyzer/config.yaml.example "${stage_dir}/"

          tar -C dist -czf "${archive_base}.tar.gz" "${archive_base}"
          shasum -a 256 "${archive_base}.tar.gz" > "${archive_base}.sha256"

          echo "archive=${archive_base}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "checksum=${archive_base}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --generate-notes
          fi

          gh release upload "${tag}" release-assets/* --clobber
