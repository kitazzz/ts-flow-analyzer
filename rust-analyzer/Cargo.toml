[package]
name = "recast-forge-analyzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rf-analyze"
path = "src/main.rs"

[features]
default = []
cfg-analysis = ["dep:oxc_semantic", "oxc_semantic/cfg", "dep:oxc_cfg"]

[dependencies]
oxc_allocator = "0.121"
oxc_parser = "0.121"
oxc_ast = "0.121"
oxc_span = "0.121"
oxc_semantic = { version = "0.121", optional = true }
oxc_cfg = { version = "0.121", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
regex = "1"
